  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "OpenRescue RTS",
    "alternateName": "Open-EM4",
    "description": "A free, open-source emergency-services real-time strategy game for the browser. Command fire brigade, ambulance, police and technical rescue in a living city with 26 kinds of incidents.",
    "genre": ["Strategy", "Simulation", "Real-time strategy"],
    "applicationCategory": "Game",
    "gamePlatform": "Web browser",
    "operatingSystem": "Any (Chrome, Edge, Firefox with WebGL), Windows (Electron build)",
    "inLanguage": ["nl", "en"],
    "license": "https://opensource.org/licenses/MIT",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },

<body>
  <noscript>
    <h1>OpenRescue RTS – gratis hulpdienstenspel in je browser</h1>
    <p>OpenRescue RTS is een open source hulpdienstensimulatie, geïnspireerd op Emergency 4. Stuur brandweer, ambulance, politie en technische hulpdiensten aan in een levende stad. Voor dit spel is JavaScript nodig.</p>
    <p>OpenRescue RTS is a free, open-source emergency-services strategy game for your browser. JavaScript is required to play. Source code: <a href="https://github.com/ProAdmin007/Open-EM4">github.com/ProAdmin007/Open-EM4</a>.</p>
  </noscript>
  <div id="game-root"></div>

  <div id="ui" class="hidden">
    <div id="topbar">
      <div class="brand">🚒 OpenRescue</div>
      <div class="stat">⏱ <b id="st-time">00:00</b></div>
      <div class="stat">⭐ Score <b id="st-score">0</b></div>
      <div class="stat">💶 Middelen <b id="st-budget">0</b></div>
      <div class="stat">🏛 Reputatie <span class="bar"><i id="st-rep"></i></span> <b id="st-rep-n">100</b>%</div>
      <div class="stat">✔ <b id="st-solved">0</b></div>
      <div class="spacer"></div>
      <div class="speed">
        <button data-act="pause" id="btn-pause" title="Pauze (spatie)">⏸</button>
        <button data-act="speed1" title="Normaal (1)">1×</button>
        <button data-act="speed2" title="Snel (2)">2×</button>
        <button data-act="speed4" title="Sneller (3)">4×</button>
        <button data-act="mute" id="btn-mute" title="Geluid aan/uit (M)">🔊</button>
        <button data-act="menu" title="Menu">☰</button>
      </div>
    </div>
    <div id="pause-banner" class="hidden">PAUZE</div>
    <div id="toasts"></div>
    <div id="incidents-panel"><h3>Meldingen</h3><div id="incident-list"></div></div>
    <div id="bottom">
      <div id="unit-panel" class="panel"></div>
      <div id="dispatch" class="panel"><div id="tabs"></div><div id="vehicle-list"></div></div>
      <div id="map-panel" class="panel">
        <canvas id="minimap" width="220" height="165"></canvas>
        <div id="cam-controls"><button data-act="zoomin" title="Inzoomen">＋</button><button data-act="zoomout" title="Uitzoomen">－</button><button data-act="home" title="Naar geselecteerde eenheid (F)">◎</button></div>
      </div>
    </div>
  </div>

  <div id="screen" class="hidden"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
